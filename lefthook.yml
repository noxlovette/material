pre-commit:
  # `jobs` run in order: regenerate the spring tokens first, so `format` sees the final CSS.
  jobs:
    - name: motion-springs
      # CSS spring tokens in motion.css are generated from springTokens in spring.ts — never let
      # them drift. Also re-runs when motion.css itself is staged, undoing hand edits to the block.
      glob:
        - 'src/lib/animation/spring.ts'
        - 'scripts/generate-motion-springs.ts'
        - 'src/lib/styles/motion.css'
      run: bun run generate:springs && git add src/lib/styles/motion.css

    - name: format
      glob: '*.{js,ts,svelte,css,json,md}'
      run: bun prettier --write {staged_files} && git add {staged_files}

pre-push:
  jobs:
    - name: icon-names
      # MaterialSymbolName and the Icons guide's catalog are generated from Google's live icon
      # data. A push can't add files to commits already made, so regenerate and fail if either
      # file drifted: commit the regenerated files, then push again. Needs network access.
      run: |
        bun run generate:icons
        git diff --exit-code --stat -- src/lib/utils/icon/icon-names.ts src/routes/guides/icons/catalog.json \
          || { echo "Material Symbols changed upstream: commit the regenerated icon files and push again."; exit 1; }
